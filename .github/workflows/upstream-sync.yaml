name: Upstream Sync

on:
  schedule:
    - cron: "0 9 * * *" # daily at 09:00 UTC
  workflow_dispatch:
  push:
    branches:
      - hkg-angle-steering-2025

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/sunnypilot/sunnypilot.git
  OPENDBC_SOURCE_URL: https://github.com/sunnypilot/opendbc.git
  OPENDBC_FORK_URL: https://github.com/422415/opendbc.git
  BRANCH: hkg-angle-steering-2025
  OPENDBC_OVERLAY_BRANCH: codex/hkg-elantra-2024-port
  OPENDBC_OVERLAY_SUBJECT: "opendbc: refresh Elantra 2024 overlay"
  OPENDBC_OVERLAY_PATCH: .github/hkg-elantra/opendbc-overlay.patch

jobs:
  sync:
    name: Rebase HKG branch and rebuild Elantra overlay
    runs-on: ubuntu-latest
    if: github.repository == 'the-database/sunnypilot'
    env:
      BRANCH_PUSH_TOKEN: ${{ github.token }}
      OPENDBC_PUSH_TOKEN: ${{ secrets.OPENDBC_PUSH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          token: ${{ github.token }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify required token
        run: |
          if [ -z "${OPENDBC_PUSH_TOKEN}" ]; then
            echo "::error::Missing OPENDBC_PUSH_TOKEN. Add a repo Actions secret with Contents write access to 422415/opendbc."
            exit 1
          fi

      - name: Rebuild branch from upstream and fork patches
        id: rebuild
        run: |
          set -euo pipefail

          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch origin "+refs/heads/master:refs/remotes/origin/master" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git fetch upstream "$BRANCH"

          OLD_HEAD=$(git rev-parse "origin/$BRANCH")
          UPSTREAM_HEAD=$(git rev-parse "upstream/$BRANCH")
          echo "old=$OLD_HEAD" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"

          git switch -C "$BRANCH" "$OLD_HEAD"
          FORK_COMMITS=$(git rev-list --reverse "upstream/$BRANCH..$OLD_HEAD")

          git reset --hard "$UPSTREAM_HEAD"

          for commit in $FORK_COMMITS; do
            subject=$(git log -1 --format=%s "$commit")
            case "$subject" in
              "$OPENDBC_OVERLAY_SUBJECT"|"opendbc: merge Elantra 2024 port into HKG branch")
                echo "Skipping generated overlay commit: $commit $subject"
                continue
                ;;
            esac

            echo "Replaying fork commit: $commit $subject"
            set +e
            git cherry-pick "$commit"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              conflicts=$(git diff --name-only --diff-filter=U)
              git cherry-pick --abort || true
              {
                echo "conflict=true"
                echo "conflict_files<<EOF"
                echo "$conflicts"
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              echo "::error::Could not replay fork commit $commit"
              echo "$conflicts"
              exit "$rc"
            fi
          done

          # Keep the push-trigger copy of this workflow and its resolved overlay patch present on the HKG branch.
          git checkout origin/master -- .github/workflows/upstream-sync.yaml "$OPENDBC_OVERLAY_PATCH"

          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Rebuild opendbc Elantra overlay
        id: opendbc
        working-directory: opendbc_repo
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add source "$OPENDBC_SOURCE_URL" 2>/dev/null || git remote set-url source "$OPENDBC_SOURCE_URL"
          git remote add fork "$OPENDBC_FORK_URL" 2>/dev/null || git remote set-url fork "$OPENDBC_FORK_URL"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git remote set-url fork "https://x-access-token:${OPENDBC_PUSH_TOKEN}@github.com/422415/opendbc.git"

          git fetch source "$BRANCH"
          git fetch fork "$OPENDBC_OVERLAY_BRANCH" || true

          BASE_OPENDBC_SHA=$(git -C .. ls-tree HEAD opendbc_repo | awk '{print $3}')
          echo "Base opendbc SHA after fork patches: $BASE_OPENDBC_SHA"
          git cat-file -e "${BASE_OPENDBC_SHA}^{commit}"

          git switch -C "$OPENDBC_OVERLAY_BRANCH" "$BASE_OPENDBC_SHA"

          PATCH_PATH="../$OPENDBC_OVERLAY_PATCH"
          if git apply --check --3way "$PATCH_PATH"; then
            git apply --3way "$PATCH_PATH"
          elif git apply --reverse --check "$PATCH_PATH"; then
            echo "Resolved Elantra overlay is already included in the opendbc base."
          else
            echo "::error::Could not apply resolved Elantra opendbc overlay patch"
            git apply --3way "$PATCH_PATH" || true
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git diff --check
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "$OPENDBC_OVERLAY_SUBJECT"
          fi

          OPENDBC_SHA=$(git rev-parse HEAD)
          echo "sha=$OPENDBC_SHA" >> "$GITHUB_OUTPUT"

          git push --force-with-lease fork "$OPENDBC_OVERLAY_BRANCH"

      - name: Point HKG branch at rebuilt opendbc overlay
        run: |
          set -euo pipefail

          git config -f .gitmodules submodule.opendbc.url "$OPENDBC_FORK_URL"
          git config submodule.opendbc.url "$OPENDBC_FORK_URL"
          git -C opendbc_repo checkout "${{ steps.opendbc.outputs.sha }}"

          git add .github/workflows/upstream-sync.yaml "$OPENDBC_OVERLAY_PATCH" .gitmodules opendbc_repo
          if ! git diff --cached --quiet; then
            git commit -m "$OPENDBC_OVERLAY_SUBJECT"
          fi

      - name: Verify no fork commits modify safety code
        id: safety_check
        run: |
          set +e
          OFFENDERS=$(git diff --name-only "upstream/$BRANCH"..HEAD -- \
            'opendbc/safety/**' \
            'opendbc/dbc/**' \
            'panda/**')
          if [ -n "$OFFENDERS" ]; then
            {
              echo "safety_violation=true"
              echo "offending_files<<EOF"
              echo "$OFFENDERS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Fork commits modify safety code paths - refusing to push"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "safety_violation=false" >> "$GITHUB_OUTPUT"
          echo "Safety check passed - no fork commit touches opendbc/safety, opendbc/dbc, or panda."

      - name: Verify submodule pins are reachable
        id: submodule_check
        run: |
          set +e
          BAD=""
          while read -r key path; do
            name=${key#submodule.}
            name=${name%.path}
            url=$(git config -f .gitmodules "submodule.$name.url")
            sha=$(git ls-tree HEAD "$path" | awk '{print $3}')
            if [ -z "$url" ] || [ -z "$sha" ]; then
              BAD="${BAD}- $path: missing URL or SHA (name=$name)\n"
              continue
            fi
            if ! git ls-remote "$url" "$sha" 2>/dev/null | grep -q "^$sha"; then
              BAD="${BAD}- \`$path\` -> \`$sha\` not reachable on \`$url\`\n"
            fi
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.path$')

          if [ -n "$BAD" ]; then
            {
              echo "submodule_violation=true"
              echo "bad_submodules<<EOF"
              printf '%b' "$BAD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::One or more submodule pins are not reachable on their configured remotes"
            printf '%b' "$BAD"
            exit 1
          fi
          echo "submodule_violation=false" >> "$GITHUB_OUTPUT"
          echo "All submodule pins are reachable."

      - name: Push synced HKG branch
        if: steps.safety_check.outputs.safety_violation != 'true' && steps.submodule_check.outputs.submodule_violation != 'true'
        run: |
          set -euo pipefail
          OLD_HEAD="${{ steps.rebuild.outputs.old }}"
          UPSTREAM_HEAD="${{ steps.rebuild.outputs.upstream }}"

          if git diff --quiet "$OLD_HEAD" HEAD && git merge-base --is-ancestor "$UPSTREAM_HEAD" "$OLD_HEAD"; then
            echo "$BRANCH is already up to date with the Elantra overlay."
            exit 0
          fi

          git push --force-with-lease "https://x-access-token:${BRANCH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"

      - name: Open sync failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "HKG Elantra sync failed on $BRANCH" \
            --body "The automated HKG sync could not update \`$BRANCH\`.

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If this is a missing-token failure, add the \`OPENDBC_PUSH_TOKEN\` Actions secret with Contents write access to \`422415/opendbc\`.

          **Replay conflicts:**
          \`\`\`
          ${{ steps.rebuild.outputs.conflict_files }}
          \`\`\`

          **Safety offenders:**
          \`\`\`
          ${{ steps.safety_check.outputs.offending_files }}
          \`\`\`

          **Bad submodule pins:**
          ${{ steps.submodule_check.outputs.bad_submodules }}" || true
