name: Upstream Sync

on:
  schedule:
    - cron: "0 9 * * *"  # daily at 09:00 UTC (~02:00 PT)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/sunnypilot/sunnypilot.git
  BRANCH: hkg-angle-steering-2025

jobs:
  sync:
    name: Rebase fork branch onto upstream
    runs-on: ubuntu-latest
    if: github.repository == 'the-database/sunnypilot'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
          # PAT with `repo` + `workflow` scopes. The default GITHUB_TOKEN
          # cannot push commits that touch .github/workflows/**, even with
          # `permissions: contents: write` — that's a hardcoded platform
          # rule for the App-installation-backed token. Upstream syncs bring
          # in workflow file changes regularly, so we need the PAT.
          token: ${{ secrets.SYNC_PUSH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream "$BRANCH"

      - name: Check whether sync is needed
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse "upstream/$BRANCH")
          BASE=$(git merge-base HEAD "upstream/$BRANCH")
          echo "local=$LOCAL"       >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          if [ "$BASE" = "$UPSTREAM" ]; then
            echo "Already up to date with upstream/$BRANCH."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase onto upstream
        if: steps.check.outputs.needs_sync == 'true'
        id: rebase
        run: |
          set +e
          git rebase "upstream/$BRANCH"
          rc=$?
          if [ $rc -ne 0 ]; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            {
              echo "conflict=true"
              echo "conflict_files<<EOF"
              echo "$CONFLICTS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "conflict=false" >> "$GITHUB_OUTPUT"

      - name: Verify no fork commits modify safety code
        # Per comma.ai's Oct 2025 policy, modifying any of these paths can result
        # in a server-access ban. Block the push if any fork-only commit ever
        # touches them. Runs whether or not a rebase happened — catches both
        # accidental drift introduced by the rebase and anything the user might
        # have pushed manually since the last sync.
        if: steps.rebase.outputs.conflict != 'true'
        id: safety_check
        run: |
          set +e
          OFFENDERS=$(git diff --name-only "upstream/$BRANCH"..HEAD -- \
            'opendbc/safety/**' \
            'opendbc/dbc/**' \
            'panda/**')
          if [ -n "$OFFENDERS" ]; then
            {
              echo "safety_violation=true"
              echo "offending_files<<EOF"
              echo "$OFFENDERS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Fork commits modify safety code paths — refusing to push"
            echo "$OFFENDERS"
            exit 1
          fi
          echo "safety_violation=false" >> "$GITHUB_OUTPUT"
          echo "Safety check passed — no fork commit touches opendbc/safety, opendbc/dbc, or panda."

      - name: Verify changed submodule pins are reachable
        # When the rebase bumps a submodule pin (e.g. opendbc, panda), verify the
        # new SHA actually exists on the configured submodule remote URL. Catches
        # the case where upstream points the parent at a SHA that's been
        # force-pushed away from the submodule repo — would silently fail on the
        # device during `git submodule update` with `not our ref <SHA>`.
        if: steps.rebase.outputs.conflict != 'true' && steps.safety_check.outputs.safety_violation != 'true'
        id: submodule_check
        run: |
          set +e
          BAD=""
          TMPDIR=$(mktemp -d)
          trap 'rm -rf "$TMPDIR"' EXIT
          idx=0
          # Only check submodule pins that actually changed in this rebase.
          # `git diff --raw --abbrev=40` rows:
          #   :160000 160000 <old_sha> <new_sha> M   <path>
          #   :160000 160000 <old_sha> <new_sha> R<pct>   <old_path>  <new_path>
          # Field 4 is the new SHA; last field is the new path (works for both M and R).
          while read -r NEW_SHA SM_PATH; do
            idx=$((idx + 1))
            # Map path → submodule name → URL (name and path can differ, e.g. opendbc_repo vs opendbc)
            NAME=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v p="$SM_PATH" '$2 == p {sub(/^submodule\./, "", $1); sub(/\.path$/, "", $1); print $1; exit}')
            URL=$(git config -f .gitmodules "submodule.$NAME.url")
            if [ -z "$URL" ] || [ -z "$NEW_SHA" ]; then
              BAD="${BAD}- $SM_PATH: missing URL or SHA (name=$NAME)\n"
              continue
            fi
            # `ls-remote` only sees advertised refs; an arbitrary commit SHA may
            # not be a ref-tip. `fetch --depth=1` works for any reachable object.
            check_repo="$TMPDIR/submodule-$idx"
            git init -q "$check_repo"
            if ! git -C "$check_repo" fetch --depth=1 "$URL" "$NEW_SHA" >/dev/null 2>&1; then
              BAD="${BAD}- \`$SM_PATH\` -> \`$NEW_SHA\` not reachable on \`$URL\`\n"
            fi
          done < <(git diff --raw --abbrev=40 "origin/$BRANCH" HEAD | awk '/^:160000 160000/ {print $4, $NF}')
          if [ -n "$BAD" ]; then
            {
              echo "submodule_violation=true"
              echo "bad_submodules<<EOF"
              printf '%b' "$BAD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::error::One or more changed submodule pins are not reachable on their remote"
            printf '%b' "$BAD"
            exit 1
          fi
          echo "submodule_violation=false" >> "$GITHUB_OUTPUT"
          echo "All changed submodule pins are reachable."

      - name: Push rebased branch
        if: steps.check.outputs.needs_sync == 'true' && steps.rebase.outputs.conflict != 'true' && steps.safety_check.outputs.safety_violation != 'true' && steps.submodule_check.outputs.submodule_violation != 'true'
        run: |
          set -euo pipefail
          OLD_HEAD="${{ steps.check.outputs.local }}"
          # Explicit lease form avoids the "stale lease" race where the local
          # ref tracker thinks origin/$BRANCH has moved when it hasn't.
          # --no-verify skips the git-lfs pre-push hook, which would try to
          # re-push upstream's LFS blobs to sunnypilot's ssh://gitlab.com
          # pushurl from .lfsconfig — the runner has no ssh key for gitlab,
          # and we don't own those blobs anyway (upstream already published
          # them; anyone pulling our fork will fetch them from the public
          # https:// read URL in the same .lfsconfig).
          git push --no-verify --force-with-lease="refs/heads/$BRANCH:$OLD_HEAD" origin "HEAD:$BRANCH"

      - name: Open conflict issue
        if: failure() && steps.rebase.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream sync conflict on $BRANCH" \
            --body "The nightly upstream-sync workflow could not rebase \`$BRANCH\` onto \`upstream/$BRANCH\` cleanly.

          **Local HEAD:** \`${{ steps.check.outputs.local }}\`
          **Upstream HEAD:** \`${{ steps.check.outputs.upstream }}\`

          **Conflicting files:**
          \`\`\`
          ${{ steps.rebase.outputs.conflict_files }}
          \`\`\`

          Resolve manually:
          \`\`\`
          git fetch upstream $BRANCH
          git checkout $BRANCH
          git rebase upstream/$BRANCH
          # resolve, then:
          git push --force-with-lease origin $BRANCH
          \`\`\`

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open safety violation issue
        if: failure() && steps.safety_check.outputs.safety_violation == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          gh issue create \
            --title "Safety code modification detected on $BRANCH — push blocked" \
            --body "The upstream-sync workflow refused to push because a fork-only commit modifies safety code paths. Per comma.ai's October 2025 policy, modifying safety code can result in a comma server-access ban.

          **Forbidden paths:** \`opendbc/safety/\`, \`opendbc/dbc/\`, \`panda/\`

          **Offending files in the fork-only delta (\`upstream/$BRANCH..HEAD\`):**
          \`\`\`
          ${{ steps.safety_check.outputs.offending_files }}
          \`\`\`

          **Local HEAD:** \`${{ steps.check.outputs.local }}\`
          **Upstream HEAD:** \`${{ steps.check.outputs.upstream }}\`

          Review fork-only commits with:
          \`\`\`
          git fetch upstream $BRANCH
          git log upstream/$BRANCH..HEAD
          \`\`\`

          Either revert the offending commit, move the change to a non-safety path, or accept the ban risk by disabling this guard.

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open submodule reachability issue
        if: failure() && steps.submodule_check.outputs.submodule_violation == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN }}
        run: |
          gh issue create \
            --title "Unreachable submodule pin on $BRANCH — push blocked" \
            --body "The upstream-sync workflow refused to push because the rebase would set a submodule pin to a SHA that doesn't exist on the configured submodule remote URL. This usually means the upstream submodule maintainer force-pushed and orphaned the SHA. Pushing this state to the fork would cause device updates to fail with \`fatal: remote error: upload-pack: not our ref <SHA>\`.

          **Bad submodule pins:**
          ${{ steps.submodule_check.outputs.bad_submodules }}

          **Local HEAD:** \`${{ steps.check.outputs.local }}\`
          **Upstream HEAD:** \`${{ steps.check.outputs.upstream }}\`

          Options:
          1. Wait for upstream to repush the missing SHA or bump to a new one (and re-run the workflow).
          2. Investigate which upstream commit introduced the bad pin: \`git log --oneline origin/$BRANCH..upstream/$BRANCH -- <submodule path>\`.
          3. If the SHA exists on a different remote, you can change the submodule URL in \`.gitmodules\` (only do this if you know what you're doing).

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
